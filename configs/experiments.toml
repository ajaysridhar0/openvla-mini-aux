[model]
architecture = "MiniVLA"
image_input = [320, 180]
image_model = [224, 224]
action_dimension = 7
action_chunk = 8

[training]
learning_rate = 2e-5
global_batch_size = 256
per_device_batch_size = 32
world_size = 8
image_augmentation = false

[adaptation.xp_900]
target_relative_weight = 20
legacy_prior_sampling_weight = 0.05
selected_prior_step = 50000

[adaptation.xp_3k_no_reps]
target_relative_weight = 100
legacy_prior_sampling_weight = 0.01
selected_prior_step = 150000

[adaptation.xp_3k_barx]
target_relative_weight = 100
legacy_prior_sampling_weight = 0.01
selected_prior_step = 250000

[methods]
no_reps = "action"
joint_reps = "bounding_box->,language_motion->,end_effector_trace->,action"
ecot = "bounding_box->end_effector_trace->language_motion->,action"

[evaluation]
episodes = 100
start_seed = 1000
action_horizon = 8
checkpoints_per_model = 3

[evaluation.max_steps]
pnp_counter_to_sink = 600
pnp_sink_to_counter = 650
turn_on_sink_faucet = 500
flip_mug_upright = 500
