[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "barx-research"
version = "0.1.0"
description = "BARX and RoboCasa-X simulation experiment release"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}
dependencies = [
    "accelerate==1.5.2",
    "draccus==0.8.0",
    "h5py==3.13.0",
    "mujoco==3.1.1",
    "numba==0.56.4",
    "numpy==1.23.5",
    "openvla",
    "opencv-python==4.11.0.86",
    "robocasa",
    "robomimic==0.3.0",
    "robosuite",
    "robosuite-models==1.0.0",
    "scipy==1.13.1",
    "tensorflow==2.15.0",
    "tensorflow-datasets==4.9.3",
    "tensorflow-graphics==2021.12.3",
    "tensorflow-metadata==1.17.2",
    "timm==0.9.10",
    "tokenizers==0.19.1",
    "torch==2.2.0",
    "torchaudio==2.2.0",
    "torchvision==0.17.0",
    "transformers==4.40.1",
    "vq-bet==0.1.0",
]

[project.optional-dependencies]
train = ["flash-attn==2.5.5"]
mg = ["mimicgen-barx"]

[tool.setuptools.packages.find]
include = ["barx*"]

[tool.uv.sources]
openvla = {path = "policy", editable = true}
robocasa = {path = "robocasa_x", editable = true}
mimicgen-barx = {path = "third_party/mimicgen"}
robosuite = {git = "https://github.com/ARISE-Initiative/robosuite.git", rev = "2ebb2a0249f7a271a3ade56725d12e32d7da8898"}
vq-bet = {git = "https://github.com/jayLEE0301/vq_bet_official.git", rev = "09d4851288ca5deaaa1ab367a208e520f8ee9a84"}
torch = {index = "pytorch-cu121"}
torchvision = {index = "pytorch-cu121"}
torchaudio = {index = "pytorch-cu121"}

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Tianshou 0.4.10's metadata predates Protobuf 3.20, but the working BARX
# environment used 3.20.3 (also required by TensorFlow 2.15) successfully.
override-dependencies = ["protobuf==3.20.3"]
# Preserve secondary runtime versions from the original Conda environment.
constraint-dependencies = [
    "attrs==25.3.0",
    "einops==0.8.1",
    "filelock==3.18.0",
    "fsspec==2025.3.0",
    "huggingface-hub==0.30.2",
    "imageio==2.22.0",
    "imageio-ffmpeg==0.6.0",
    "jinja2==3.1.6",
    "json-numpy==2.1.0",
    "jsonlines==4.0.0",
    "matplotlib==3.10.1",
    "networkx==3.4.2",
    "packaging==24.2",
    "pillow==11.1.0",
    "platformdirs==4.3.7",
    "psutil==7.0.0",
    "pygame==2.1.2",
    "pynput==1.8.1",
    "pyyaml==6.0.2",
    "regex==2024.11.6",
    "requests==2.32.3",
    "rich==13.9.4",
    "safetensors==0.5.3",
    "setuptools==75.8.0",
    "sympy==1.13.1",
    "termcolor==2.5.0",
    "tqdm==4.67.1",
    "trimesh==4.6.5",
    "typing-extensions==4.12.2",
    "urllib3==2.3.0",
    "wandb==0.19.8",
    "wheel==0.45.1",
    "hidapi==0.14.0.post4",
    "lxml==5.3.1",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.extra-build-dependencies]
flash-attn = [{requirement = "torch", match-runtime = true}]

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.5.5"
requires-dist = ["torch", "einops"]

# The pinned robosuite commit is unmodified upstream 1.5.1. Its published
# metadata requires newer MuJoCo and Mink, while the BARX experiments used
# MuJoCo 3.1.1 and do not exercise robosuite's optional Mink example. Keep
# release-environment policy here instead of patching third-party source.
[[tool.uv.dependency-metadata]]
name = "robosuite"
version = "1.5.1"
requires-dist = [
    "numpy>=1.13.3",
    "numba>=0.49.1",
    "scipy>=1.2.3",
    "mujoco==3.1.1",
    "Pillow",
    "opencv-python",
    "pynput",
    "termcolor",
    "pytest",
    "tqdm",
]

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.9.10"]
