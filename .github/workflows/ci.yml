name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.11"
          python-version: "3.10"
          enable-cache: true

      - name: Install lightweight test dependencies
        run: |
          uv venv
          uv pip install h5py==3.13.0 numpy==1.23.5 ruff==0.9.10

      - name: Verify dependency lock
        run: uv lock --check

      - name: Run compatibility tests
        run: uv run --no-sync python -m unittest discover -s tests -v

      - name: Lint release code
        run: >-
          uv run --no-sync ruff check barx scripts tests dataset/rlds
          policy/experiments/robot/robocasa_x/utils.py
